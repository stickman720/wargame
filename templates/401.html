<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 · Unauthorized</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ============================================================
           THEME: RED / WHITE / ORANGE
           ============================================================ */
        :root {
            --red: #d32f2f;
            --red-dark: #b71c1c;
            --red-soft: #fdecea;
            --orange: #f57c00;
            --orange-light: #ffb74d;
            --orange-soft: #fff3e0;
            --white: #ffffff;
            --off-white: #fffaf5;
            --gray-bg: #f5f3f0;
            --text-dark: #2c2c2c;
            --text-muted: #7a6e63;
            --shadow-sm: 0 4px 12px rgba(211, 47, 47, 0.05);
            --shadow-md: 0 12px 28px rgba(211, 47, 47, 0.08), 0 2px 8px rgba(245, 124, 0, 0.06);
            --shadow-lg: 0 24px 60px -12px rgba(211, 47, 47, 0.35);
            --radius-lg: 24px;
            --transition: all 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }

        /* ---------- BODY / BACKGROUND ---------- */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--gray-bg);
            color: var(--text-dark);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(245, 124, 0, 0.06) 0%, transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(211, 47, 47, 0.06) 0%, transparent 40%);
            position: relative;
            overflow: hidden;
        }

        /* subtle decorative blobs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 420px;
            height: 420px;
            background: var(--orange-light);
            top: -120px;
            left: -120px;
        }

        body::after {
            width: 380px;
            height: 380px;
            background: var(--red);
            bottom: -140px;
            right: -140px;
        }

        /* ---------- CARD ---------- */
        .error-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border-top: 8px solid transparent;
            border-image: linear-gradient(90deg, var(--red) 0%, var(--red) 40%, var(--orange) 60%, var(--orange-light) 100%) 1;
            padding: 3rem 2.5rem 2.5rem;
            text-align: center;
            transition: var(--transition);
            animation: riseIn 0.5s ease;
        }

        .error-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 32px 70px -12px rgba(211, 47, 47, 0.4);
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- ICON ---------- */
        .lock-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--red), var(--orange));
            color: white;
            font-size: 2.6rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 16px 32px -10px rgba(211, 47, 47, 0.5);
            border: 4px solid rgba(255, 255, 255, 0.85);
            animation: pulse 2.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1);     box-shadow: 0 16px 32px -10px rgba(211, 47, 47, 0.5); }
            50%      { transform: scale(1.04);  box-shadow: 0 22px 42px -10px rgba(245, 124, 0, 0.55); }
        }

        /* ---------- STATUS CODE ---------- */
        .status-code {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -3px;
            background: linear-gradient(135deg, var(--red), var(--orange));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        /* ---------- HEADINGS ---------- */
        .error-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.4px;
            margin-bottom: 0.6rem;
        }

        .error-title span {
            color: var(--orange);
        }

        .error-message {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 380px;
            margin: 0 auto 1.8rem;
        }

        /* ---------- DIVIDER ---------- */
        .divider {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 1.6rem 0 1.4rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--orange-light), transparent);
        }

        /* ---------- BUTTONS ---------- */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: var(--transition);
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--red), var(--orange));
            color: white;
            box-shadow: 0 12px 24px -8px rgba(211, 47, 47, 0.45);
        }

        .btn-primary:hover {
            background: linear-gradient(145deg, var(--red-dark), var(--orange));
            transform: translateY(-2px);
            box-shadow: 0 18px 30px -8px rgba(211, 47, 47, 0.6);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--red-dark);
            border: 2px solid var(--orange-light);
        }

        .btn-secondary:hover {
            background: var(--orange-soft);
            border-color: var(--orange);
            transform: translateY(-2px);
        }

        /* ---------- HINT ---------- */
        .hint {
            margin-top: 1.6rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1rem;
            background: var(--orange-soft);
            border-radius: 14px;
            border: 1px dashed rgba(245, 124, 0, 0.4);
        }

        .hint i {
            color: var(--orange);
        }

        .hint a {
            color: var(--red-dark);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px dotted var(--red);
        }

        .hint a:hover {
            color: var(--orange);
            border-bottom-color: var(--orange);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .error-card { padding: 2.2rem 1.5rem 2rem; }
            .status-code { font-size: 3.4rem; }
            .error-title { font-size: 1.35rem; }
            .lock-circle {
                width: 80px;
                height: 80px;
                font-size: 2.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <!-- Lock icon -->
        <div class="lock-circle">
            <i class="fas fa-lock"></i>
        </div>

        <!-- Status code -->
        <div class="status-code">401</div>

        <!-- Headings -->
        <h1 class="error-title">Access <span>Denied</span></h1>
        <p class="error-message">
            You need to be signed in to view this page. Please log in with your
            credentials and try again.
        </p>


</body>
</html>
