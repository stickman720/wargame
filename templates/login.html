<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sign In | Portal</title>
    <!-- Font Awesome for a subtle icon (optional, but adds a nice touch) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- RESET & GLOBAL ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        }

        /* ---------- ROOT VARIABLES (theme colors) ---------- */
        :root {
            --red: #d32f2f;        /* deep red */
            --red-dark: #b71c1c;
            --orange: #f57c00;     /* vibrant orange */
            --orange-light: #ffb74d;
            --white: #ffffff;
            --off-white: #fff8f0;  /* warm white for backgrounds */
            --gray-light: #f5f5f5;
            --shadow: 0 12px 28px rgba(0, 0, 0, 0.2), 0 4px 10px rgba(0, 0, 0, 0.1);
            --border-radius: 24px;
            --transition: all 0.25s ease;
        }

        /* ---------- BODY / BACKGROUND ---------- */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            /* background image: base_url + /static/images/baner.jpg
               Using a CSS variable would be ideal, but we must hardcode a relative path.
               Since the page is portable, we assume the image path is correct relative to the page's base URL.
               To make it truly portable, we use a relative path that works if the page is served from the same root. */
            background-image: url('/static/images/baner.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            /* Fallback background color in case image fails to load */
            background-color: #2d1b0e;
        }

        /* Soft overlay to improve readability + warm tint */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, rgba(211, 47, 47, 0.25) 0%, rgba(245, 124, 0, 0.15) 100%);
            backdrop-filter: brightness(1.02) saturate(1.1);
            pointer-events: none; /* allow clicks through to form */
            z-index: 0;
        }

        /* ---------- LOGIN CARD ---------- */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 2.5rem 2rem 2.2rem;
            transition: var(--transition);
            /* subtle inner glow */
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(245, 124, 0, 0.2), 0 0 0 4px rgba(255, 255, 255, 0.5);
        }

        /* accent stripe top (red + orange) */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--red) 0%, var(--red) 40%, var(--orange) 60%, var(--orange-light) 100%);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            box-shadow: 0 2px 8px rgba(245, 124, 0, 0.3);
        }

        /* ---------- HEADER / LOGO ---------- */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
            margin-top: 0.5rem;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, var(--red), var(--orange));
            border-radius: 50%;
            color: white;
            font-size: 2rem;
            box-shadow: 0 10px 20px -6px rgba(211, 47, 47, 0.4);
            margin-bottom: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: var(--transition);
        }

        .login-header h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #2c2c2c;
            margin-bottom: 0.35rem;
        }

        .login-header h2 span {
            color: var(--orange);
            background: linear-gradient(145deg, var(--red), var(--orange));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .login-header p {
            color: #5e5e5e;
            font-size: 0.95rem;
            font-weight: 400;
            border-bottom: 1px solid rgba(245, 124, 0, 0.3);
            padding-bottom: 1rem;
            display: inline-block;
        }

        /* ---------- FORM ---------- */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--red-dark);
            margin-left: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .input-group label i {
            color: var(--orange);
            font-size: 0.9rem;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: var(--white);
            border: 2px solid #e0e0e0;
            border-radius: 60px;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            transition: var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .input-field:focus-within {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(245, 124, 0, 0.2);
            background: #fffdf9;
        }

        .input-field i {
            color: #b0b0b0;
            font-size: 1.1rem;
            width: 1.5rem;
            transition: var(--transition);
        }

        .input-field:focus-within i {
            color: var(--red);
        }

        .input-field input {
            width: 100%;
            padding: 1rem 1rem 1rem 0.5rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            color: #1e1e1e;
            outline: none;
            font-weight: 500;
        }

        .input-field input::placeholder {
            color: #aaa;
            font-weight: 400;
            font-size: 0.95rem;
        }

        /* ---------- BUTTON ---------- */
        .login-btn {
            margin-top: 0.8rem;
            background: linear-gradient(145deg, var(--red), var(--orange));
            border: none;
            border-radius: 60px;
            padding: 1rem 1.8rem;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            box-shadow: 0 12px 24px -8px rgba(211, 47, 47, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
        }

        .login-btn:hover {
            background: linear-gradient(145deg, var(--red-dark), var(--orange));
            transform: translateY(-2px);
            box-shadow: 0 20px 30px -8px rgba(211, 47, 47, 0.6);
        }

        .login-btn:active {
            transform: translateY(1px);
            box-shadow: 0 8px 16px -6px rgba(211, 47, 47, 0.5);
        }

        .login-btn i {
            font-size: 1rem;
            transition: var(--transition);
        }

        .login-btn:hover i {
            transform: translateX(4px);
        }

        /* ---------- FOOTER / SMALL LINKS ---------- */
        .login-footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.9rem;
            color: #6b6b6b;
            border-top: 1px solid rgba(245, 124, 0, 0.2);
            padding-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .login-footer a {
            color: var(--red);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            border-bottom: 1px dotted transparent;
        }

        .login-footer a:hover {
            color: var(--orange);
            border-bottom: 1px dotted var(--orange);
        }

        /* ---------- ERROR / MESSAGE (optional) ---------- */
        .message {
            background: rgba(211, 47, 47, 0.1);
            border-left: 4px solid var(--red);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            color: var(--red-dark);
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .message.show {
            display: flex;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem 1.8rem;
            }
            .login-header h2 {
                font-size: 1.8rem;
            }
            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }
            .login-btn {
                font-size: 1rem;
                padding: 0.9rem 1.2rem;
            }
            body {
                padding: 1rem;
            }
        }

        @media (max-width: 360px) {
            .login-footer {
                flex-direction: column;
                gap: 0.5rem;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- decorative top stripe is added via pseudo-element -->

        <div class="login-header">
            <div class="logo-icon">
                <i class="fas fa-bolt"></i>
            </div>
            <h2><span>Sign</span> In</h2>
            <p>access your dashboard</p>
        </div>

        <!-- simple status message (hidden by default) -->
        <div id="messageBox" class="message">
            <i class="fas fa-exclamation-circle"></i>
            <span id="messageText">Invalid credentials</span>
        </div>

        <!-- 
            LOGIN FORM
            - POST endpoint: base_url + /api/auth/login
            - The action attribute uses a relative URL: "/api/auth/login".
              This assumes the page is served from the same origin (base_url) and 
              the API is at base_url + /api/auth/login. It's the most portable approach.
            - Method is POST.
            - No CSRF token included for simplicity, but you can add if needed.
        -->
        <form class="login-form" action="/api/auth/login" method="POST" id="loginForm">
            <div class="input-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username or Email
                </label>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="text" id="username" name="username" placeholder="your@email.com" autocomplete="username" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="input-field">
                    <i class="fas fa-key"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">
                <span>Login</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

    </div>

    <!-- Minimal JavaScript for UX (disable button after submit, prevent double submission) 
         and demonstrate the base_url construction. 
         This is optional but enhances portability and user experience. -->
    <script>
        (function() {
            const form = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');

            // Optional: show a simple message if the page was loaded with ?error=... 
            // (just for demonstration, not required)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('error')) {
                messageText.textContent = urlParams.get('error') || 'Login failed. Please try again.';
                messageBox.classList.add('show');
            }

            // Handle form submission
            form.addEventListener('submit', function(e) {
                // Disable the submit button to prevent double clicks
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
                
                // The form will submit normally to the action URL: /api/auth/login
                // That endpoint is expected to be at base_url + /api/auth/login.
                // Because we use a relative path, it's portable as long as the page is served from the same domain.
                // If you need to explicitly build base_url in JS (e.g., from a meta tag), uncomment the lines below:
                /*
                const baseUrl = window.location.origin; // or a meta tag content
                form.action = baseUrl + '/api/auth/login';
                */
            });

            // Re-enable button if the user navigates back (for better UX)
            window.addEventListener('pageshow', function() {
                if (submitBtn.disabled) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Login</span><i class="fas fa-arrow-right"></i>';
                }
            });

            // Small touch: if there's a query param "error", hide it after 6 seconds? Not necessary, just cosmetic.
            if (messageBox.classList.contains('show')) {
                setTimeout(() => {
                    messageBox.classList.remove('show');
                }, 6000);
            }
        })();
    </script>
</body>
</html>
