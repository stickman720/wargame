<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sign In | Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- RESET & GLOBAL ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        }

        /* ---------- THEME VARIABLES ---------- */
        :root {
            --red: #d32f2f;
            --red-dark: #b71c1c;
            --orange: #f57c00;
            --orange-light: #ffb74d;
            --white: #ffffff;
            --off-white: #fff8f0;
            --gray-light: #f5f5f5;
            --border-radius: 24px;
            --transition: all 0.25s ease;
            --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.4),
                      0 0 0 1px rgba(245, 124, 0, 0.2),
                      0 0 0 4px rgba(255, 255, 255, 0.5);
        }

        /* ---------- BODY / BACKGROUND ---------- */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            /* Jinja url_for → resolves correctly regardless of mount point */
            background-image: url("{{ url_for('static', path='images/baner.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            background-color: #2d1b0e;
        }

        /* Warm tint overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(145deg, rgba(211, 47, 47, 0.25) 0%, rgba(245, 124, 0, 0.15) 100%);
            backdrop-filter: brightness(1.02) saturate(1.1);
            pointer-events: none;
            z-index: 0;
        }

        /* ---------- LOGIN CARD ---------- */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 2.5rem 2rem 2.2rem;
            transition: var(--transition);
        }

        /* Top accent stripe */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg,
                var(--red) 0%, var(--red) 40%,
                var(--orange) 60%, var(--orange-light) 100%);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            box-shadow: 0 2px 8px rgba(245, 124, 0, 0.3);
        }

        /* ---------- HEADER / LOGO ---------- */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
            margin-top: 0.5rem;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, var(--red), var(--orange));
            border-radius: 50%;
            color: white;
            font-size: 2rem;
            box-shadow: 0 10px 20px -6px rgba(211, 47, 47, 0.4);
            margin-bottom: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: var(--transition);
        }

        .login-header h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #2c2c2c;
            margin-bottom: 0.35rem;
        }

        .login-header h2 span {
            background: linear-gradient(145deg, var(--red), var(--orange));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .login-header p {
            color: #5e5e5e;
            font-size: 0.95rem;
            font-weight: 400;
            border-bottom: 1px solid rgba(245, 124, 0, 0.3);
            padding-bottom: 1rem;
            display: inline-block;
        }

        /* ---------- FORM ---------- */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--red-dark);
            margin-left: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .input-group label i {
            color: var(--orange);
            font-size: 0.9rem;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: var(--white);
            border: 2px solid #e0e0e0;
            border-radius: 60px;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            transition: var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .input-field:focus-within {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(245, 124, 0, 0.2);
            background: #fffdf9;
        }

        .input-field i {
            color: #b0b0b0;
            font-size: 1.1rem;
            width: 1.5rem;
            transition: var(--transition);
        }

        .input-field:focus-within i {
            color: var(--red);
        }

        .input-field input {
            width: 100%;
            padding: 1rem 1rem 1rem 0.5rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            color: #1e1e1e;
            outline: none;
            font-weight: 500;
        }

        .input-field input::placeholder {
            color: #aaa;
            font-weight: 400;
            font-size: 0.95rem;
        }

        /* ---------- BUTTON ---------- */
        .login-btn {
            margin-top: 0.8rem;
            background: linear-gradient(145deg, var(--red), var(--orange));
            border: none;
            border-radius: 60px;
            padding: 1rem 1.8rem;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            box-shadow: 0 12px 24px -8px rgba(211, 47, 47, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
        }

        .login-btn:hover {
            background: linear-gradient(145deg, var(--red-dark), var(--orange));
            transform: translateY(-2px);
            box-shadow: 0 20px 30px -8px rgba(211, 47, 47, 0.6);
        }

        .login-btn:active {
            transform: translateY(1px);
            box-shadow: 0 8px 16px -6px rgba(211, 47, 47, 0.5);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn i {
            font-size: 1rem;
            transition: var(--transition);
        }

        .login-btn:hover i {
            transform: translateX(4px);
        }

        /* ---------- FOOTER ---------- */
        .login-footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.9rem;
            color: #6b6b6b;
            border-top: 1px solid rgba(245, 124, 0, 0.2);
            padding-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .login-footer a {
            color: var(--red);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            border-bottom: 1px dotted transparent;
        }

        .login-footer a:hover {
            color: var(--orange);
            border-bottom: 1px dotted var(--orange);
        }

        /* ---------- ERROR MESSAGE ---------- */
        .message {
            background: rgba(211, 47, 47, 0.1);
            border-left: 4px solid var(--red);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            color: var(--red-dark);
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .message.show {
            display: flex;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem 1.8rem;
            }
            .login-header h2 {
                font-size: 1.8rem;
            }
            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }
            .login-btn {
                font-size: 1rem;
                padding: 0.9rem 1.2rem;
            }
            body {
                padding: 1rem;
            }
        }

        @media (max-width: 360px) {
            .login-footer {
                flex-direction: column;
                gap: 0.5rem;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">

        <div class="login-header">
            <div class="logo-icon">
                <i class="fas fa-bolt"></i>
            </div>
            <h2><span>Sign</span> In</h2>
            <p>access your dashboard</p>
        </div>

        {# ---------- ERROR MESSAGE (rendered by Jinja when ?error= is present) ---------- #}
        {% if error %}
        <div id="messageBox" class="message show">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        {# ---------- LOGIN FORM ---------- #}
        <form class="login-form" action="/api/auth/login" method="POST" id="loginForm">
            <div class="input-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username or Email
                </label>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="text" id="username" name="username"
                           placeholder="your@email.com"
                           autocomplete="username" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="input-field">
                    <i class="fas fa-key"></i>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••"
                           autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">
                <span>Login</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer">
            <a href="#">Forgot password?</a>
        </div>
    </div>

    <script>
        (function () {
            const form = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');

            // Prevent double submission + show spinner
            form.addEventListener('submit', function () {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            });

            // Re-enable if user navigates back
            window.addEventListener('pageshow', function () {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Login</span><i class="fas fa-arrow-right"></i>';
            });
        })();
    </script>
</body>
</html>
